name: Top quality and deployment artifact

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ci
      - name: Prepare root publication and URL-compatible fallback
        if: hashFiles('site-release.json') != ''
        run: |
          if node --input-type=module -e "import fs from 'node:fs'; process.exit(JSON.parse(fs.readFileSync('site-release.json')).layout === 'parallel' ? 0 : 1)"; then
            npm run prepare:site-release
            cp -R ../tmp/site-releases release-preparation
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: top-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: top-root-release-preparation-${{ github.sha }}
          path: release-preparation/
          if-no-files-found: ignore
          retention-days: 30
