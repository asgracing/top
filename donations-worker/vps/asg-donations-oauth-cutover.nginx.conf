# Transitional cutover: keep /recent on the legacy Worker while OAuth is
# completed against the loopback-only VPS service.
location = /donations-api/oauth/start {
    return 404;
}

location = /donations-api/oauth/status {
    return 404;
}

location = /donations-api/oauth/callback {
    limit_except GET { deny all; }
    limit_req zone=asg_donations_oauth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8120/oauth/callback$is_args$args;
    include proxy_params;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
}
