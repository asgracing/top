# Include inside the TLS server block for data.asgracing.ru.
# OAuth administration is intentionally reachable only over an SSH tunnel to
# 127.0.0.1:8120; nginx never exposes /oauth/start or /oauth/status.

location = /donations-api/health {
    limit_except GET OPTIONS { deny all; }
    limit_req zone=asg_donations burst=20 nodelay;
    proxy_pass http://127.0.0.1:8120/health;
    include proxy_params;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
}

location = /donations-api/recent {
    limit_except GET OPTIONS { deny all; }
    limit_req zone=asg_donations burst=20 nodelay;
    proxy_pass http://127.0.0.1:8120/recent;
    include proxy_params;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
}

location = /donations-api/oauth/callback {
    limit_except GET { deny all; }
    limit_req zone=asg_donations_oauth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8120/oauth/callback$is_args$args;
    include proxy_params;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
}

location ^~ /donations-api/ {
    return 404;
}
