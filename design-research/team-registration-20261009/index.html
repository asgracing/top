<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Командная запись · макет V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e16;color:#f1f6fc;font:14px/1.5 'Segoe UI',sans-serif}header{padding:16px 22px;background:#122033;border-bottom:1px solid #52677e66}h1{font-size:21px;margin:0 0 5px}p{margin:5px 0 12px;color:#b7c6d8}.tools{display:flex;gap:12px;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}select,button{padding:10px;background:#223850;color:white;border:1px solid #7891ab;border-radius:3px;font:inherit}main{padding:16px 0}iframe{display:block;margin:auto;border:1px solid #52677e66;width:100%;height:1100px;background:#080e16}
</style><script type="module" src="./preview.js"></script></head><body><header><h1>Запись команды на гонку · новый дизайн V2</h1><p>Интерактивный макет на вымышленных данных. Использует рабочую форму и её CSS. Все запросы перехватываются локально.</p><div class="tools"><label>Сценарий<select id="scenario"><option value="new">Новая заявка</option><option value="waiting">Пилот подтверждает участие</option><option value="confirmed">Состав подтверждён</option><option value="closed">Регистрация закрыта</option><option value="number">Нет номера капитана</option><option value="stale">Нет свежих данных</option><option value="guest">Steam-вход</option><option value="no-team">Нет команды</option></select></label><label>Язык<select id="lang"><option value="ru">RU</option><option value="en">EN</option></select></label><label>Ширина<select id="width"><option value="100%">Компьютер</option><option value="768px">Планшет · 768</option><option value="390px">Телефон · 390</option><option value="320px">Телефон · 320</option></select></label><button id="reset" type="button">Сбросить сценарий</button></div></header><main><iframe id="preview" title="Макет командной регистрации"></iframe></main></body></html>
