<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self' https://auth.asgracing.ru; img-src https://*.steamstatic.com https://steamcdn-a.akamaihd.net; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>ASG Racing Driver Overlay</title>
  <link rel="stylesheet" href="../../styles/components/rating-palette.css?v=20261003palette1">
  <link rel="stylesheet" href="./styles.css?v=20261003palette1">
</head>
<body>
  <main class="driver-overlay" id="driver-overlay" hidden aria-label="ASG Racing driver rating">
    <section class="driver-overlay__bar">
      <div class="driver-overlay__brand" aria-label="ASG Racing">
        <strong>ASG</strong><span>RACING</span>
      </div>
      <div class="driver-overlay__metric driver-overlay__metric--elo">
        <div class="driver-overlay__pill driver-overlay__elo-pill">
          <strong data-elo-category>RACER</strong><i></i><b data-elo>—</b>
        </div>
      </div>
      <div class="driver-overlay__metric driver-overlay__metric--sr">
        <div class="driver-overlay__pill driver-overlay__sr-pill" data-sr>SR —</div>
      </div>
      <div class="driver-overlay__metric driver-overlay__metric--number">
        <div class="driver-overlay__pill driver-overlay__number-pill" data-race-number>—</div>
      </div>
      <div class="driver-overlay__avatar">
        <img data-avatar alt="" referrerpolicy="no-referrer" hidden>
        <span data-avatar-fallback>ASG</span>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js?v=20261003palette1"></script>
  <script type="module" src="../daily-refresh.js?v=20261003daily1"></script>
</body>
</html>
