<!doctype html>
<html data-preview="true" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Page not found | ASG Racing · Preview</title>
  <link rel="stylesheet" href="/preview/runtime/styles/tokens.css" />
  <link rel="stylesheet" href="/preview/runtime/styles/base.css" />
  <script>
    if (/^\/top(?:\/|$)/.test(window.location.pathname)) {
      const path = window.location.pathname.replace(/^\/top(?=\/|$)/, "") || "/";
      window.location.replace(`${path}${window.location.search}${window.location.hash}`);
    }
  </script>
<link rel="stylesheet" href="/preview/design.css?v=20261004p1">
<script type="module" src="/preview/app.js?v=20261004p1"></script>
</head>
<body data-preview-route="/404.html">
  <main class="container" style="padding-block:4rem">
    <h1 id="not-found-title">Page not found</h1>
    <p id="not-found-copy">The link may be outdated. Return to the ASG Racing home page.</p>
    <p><a class="btn btn-primary" href="/preview/" id="not-found-home">Home</a></p>
  </main>
  <script type="module">
    import { resolvePageLocale } from "/preview/runtime/src/shared/localized-page.js?v=20260920routes1";
    const routeLanguage = location.pathname === "/ru" || location.pathname.startsWith("/ru/") ? "ru" : null;
    const language = routeLanguage || resolvePageLocale({ documentRef: document, windowRef: window }).language;
    const copy = language === "ru"
      ? {
          title: "Страница не найдена",
          body: "Возможно, ссылка устарела. Перейдите на главную страницу ASG Racing.",
          home: "На главную",
          href: "/ru/"
        }
      : {
          title: "Page not found",
          body: "The link may be outdated. Return to the ASG Racing home page.",
          home: "Home",
          href: "/"
        };
    document.documentElement.lang = language;
    document.title = `${copy.title} | ASG Racing`;
    document.getElementById("not-found-title").textContent = copy.title;
    document.getElementById("not-found-copy").textContent = copy.body;
    const home = document.getElementById("not-found-home");
    home.textContent = copy.home;
    home.href = copy.href;
  </script>
</body>
</html>
